{% extends 'base.html' %}{% block body %}<div class="container py-4" style="max-width:520px"><div class="glass"><h2>Create account</h2>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf() }}">
<label class="form-label" for="role">I am a</label><select id="role" name="role" class="form-select" onchange="document.getElementById('s').hidden=this.value!='student';document.getElementById('p').hidden=this.value!='parent'"><option value="student">Student</option><option value="parent">Parent</option></select>
<label class="form-label mt-2" for="name">Full name</label><input id="name" name="name" class="form-control" required minlength="2">
<label class="form-label mt-2" for="email">Email</label><input id="email" name="email" type="email" class="form-control" required>
<label class="form-label mt-2" for="pw">Password (8+ characters)</label><input id="pw" name="password" type="password" minlength="8" class="form-control" required>
<div id="p" hidden><label class="form-label mt-2" for="ph">Phone</label><input id="ph" name="phone" class="form-control"></div>
<div id="s"><label class="form-label mt-2">Home village</label><select name="village" class="form-select">{% for v in villages %}<option>{{ v }}</option>{% endfor %}</select>
<label class="form-label mt-2">College</label><select name="college" class="form-select">{% for c in colleges %}<option>{{ c }}</option>{% endfor %}</select>
<div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="minor" id="minor" checked><label for="minor" class="form-check-label">I am under 18</label></div>
<label class="form-label mt-2">Parent's registered email (required if under 18)</label><input name="parent_email" type="email" class="form-control">
<div class="form-check mt-2"><input class="form-check-input" type="checkbox" name="consent" id="consent"><label for="consent" class="form-check-label">My parent consents to ride details being shared with them</label></div></div>
<button class="btn btn-em w-100 mt-3">Register</button></form></div></div>{% endblock %}
